name: Benchmark Golden Dataset

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to execute the workflow (e.g., ubuntu-latest, self-hosted, gpu-runner)'
        required: true
        type: string
        default: 'spark-1697'
      target_url:
        description: 'Target URL for the API endpoint (e.g., http://localhost:8000)'
        required: true
        type: string
        default: 'http://localhost:8000'
      dataset:
        description: 'Dataset name (e.g., vdaita/edit_5k_char)'
        required: true
        type: choice
        options:
          - vdaita/edit_5k_char
          - abisee/cnn_dailymail
          - AI-MO/NuminaMath-1.5
          - likaixin/InstructCoder
          - dataset/ShareGPT.json
        default: 'vdaita/edit_5k_char'
      rate_type:
        description: 'Rate type (e.g., concurrent, constant)'
        required: true
        type: string
        default: 'concurrent'
      rate:
        description: 'Request rate'
        required: true
        type: string
        default: '10'
      max_seconds:
        description: 'Maximum duration of the benchmark in seconds'
        required: true
        type: string
        default: '60'
      output_path:
        description: 'Output directory path'
        required: false
        type: string
        default: 'output'

jobs:
  benchmark:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect machine info
        run: |
          mkdir -p ${{ inputs.output_path }}
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # CPU info
          CPU_MODEL=$(lscpu | grep 'Model name' | head -1 | sed 's/Model name:\s*//')
          CPU_SOCKETS=$(lscpu | grep '^Socket(s):' | head -1 | awk '{print $2}')
          CPU_CORES_PER_SOCKET=$(lscpu | grep '^Core(s) per socket:' | head -1 | awk '{print $4}')
          CPU_THREADS_PER_CORE=$(lscpu | grep '^Thread(s) per core:' | head -1 | awk '{print $4}')
          CPU_TOTAL_CORES=$((CPU_SOCKETS * CPU_CORES_PER_SOCKET))
          CPU_TOTAL_THREADS=$((CPU_TOTAL_CORES * CPU_THREADS_PER_CORE))
          CPU_ARCH=$(lscpu | grep '^Architecture:' | awk '{print $2}')
          MEM_TOTAL=$(free -b | awk '/^Mem:/{print $2}')
          MEM_AVAIL=$(free -b | awk '/^Mem:/{print $7}')

          # GPU info
          GPU_JSON="[]"
          if command -v nvidia-smi &> /dev/null; then
            GPU_JSON=$(nvidia-smi --query-gpu=index,name,driver_version,memory.total,compute_cap,uuid \
              --format=csv,noheader,nounits | python3 -c "
          import sys, json
          rows = []
          for line in sys.stdin:
              parts = [p.strip() for p in line.split(',')]
              if len(parts) >= 6:
                  def safe_int(v):
                      try: return int(v)
                      except: return None
                  rows.append({
                      'index': safe_int(parts[0]),
                      'name': parts[1],
                      'driver_version': parts[2],
                      'memory_total_mib': safe_int(parts[3]),
                      'compute_capability': parts[4],
                      'uuid': parts[5]
                  })
          print(json.dumps(rows))
          ")
          fi

          python3 - <<PYEOF
          import json, os
          data = {
              'timestamp': '${TIMESTAMP}',
              'os': '$(uname -s)',
              'kernel': '$(uname -r)',
              'hostname': '$(hostname)',
              'cpu': {
                  'model': '${CPU_MODEL}',
                  'architecture': '${CPU_ARCH}',
                  'sockets': int('${CPU_SOCKETS}' or 0),
                  'cores_per_socket': int('${CPU_CORES_PER_SOCKET}' or 0),
                  'threads_per_core': int('${CPU_THREADS_PER_CORE}' or 0),
                  'total_cores': int('${CPU_TOTAL_CORES}' or 0),
                  'total_threads': int('${CPU_TOTAL_THREADS}' or 0),
              },
              'memory': {
                  'total_bytes': int('${MEM_TOTAL}' or 0),
                  'available_bytes': int('${MEM_AVAIL}' or 0),
              },
              'gpus': json.loads('${GPU_JSON}'),
          }
          with open('${{ inputs.output_path }}/machine_info.json', 'w') as f:
              json.dump(data, f, indent=2)
          PYEOF

      - name: Run Benchmark
        run: |
          ~/.local/bin/uv venv
          source .venv/bin/activate
          ~/.local/bin/uv pip install guidellm

          # Determine data column and extra args based on dataset
          case "${{ inputs.dataset }}" in
            "AI-MO/NuminaMath-1.5")
              DATA_COLUMN_MAPPER='{"text_column":"problem"}'
              ;;
            "dataset/ShareGPT.json")
              DATA_COLUMN_MAPPER='{"text_column":"text"}'
              ;;
            "abisee/cnn_dailymail")
              DATA_COLUMN_MAPPER='{"text_column":"article"}'
              DATA_ARGS='{"name": "3.0.0"}'
              ;;
            "likaixin/InstructCoder")
              DATA_COLUMN_MAPPER='{"text_column":"input","prefix_column":"instruction"}'
              ;;
            *)
              DATA_COLUMN_MAPPER='{"text_column":"code"}'
              ;;
          esac

          echo "DATA_COLUMN_MAPPER=${DATA_COLUMN_MAPPER}" >> $GITHUB_ENV

          CMD=(guidellm benchmark
            --target "${{ inputs.target_url }}"
            --data "${{ inputs.dataset }}"
            --rate-type "${{ inputs.rate_type }}"
            --rate "${{ inputs.rate }}"
            --max-seconds "${{ inputs.max_seconds }}"
            --data-column-mapper "${DATA_COLUMN_MAPPER}"
            --output-dir "${{ inputs.output_path }}"
          )
          if [ -n "${DATA_ARGS:-}" ]; then
            CMD+=(--data-args "${DATA_ARGS}")
          fi
          "${CMD[@]}"

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: ${{ inputs.output_path }}
          retention-days: 30

      - name: Push results to benchmark-results branch
        if: always()
        run: |
          TIMESTAMP=$(date -u '+%Y%m%dT%H%M%SZ')
          DATASET_NAME=$(echo "${{ inputs.dataset }}" | sed 's|.*/||; s|\.json$||')
          RESULT_DIR="results/${DATASET_NAME}/${TIMESTAMP}_${{ inputs.runner }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          # Fetch and switch to benchmark-results branch (create orphan if not exists)
          if git fetch origin benchmark-results:benchmark-results 2>/dev/null; then
            git checkout benchmark-results
          else
            git checkout --orphan benchmark-results
            git rm -rf . --quiet 2>/dev/null || true
          fi

          # Copy results into timestamped directory
          mkdir -p "${RESULT_DIR}"
          cp -r ${{ inputs.output_path }}/. "${RESULT_DIR}/"

          # Write run metadata as JSON
          python3 - <<PYEOF
          import json
          metadata = {
              'runner': '${{ inputs.runner }}',
              'target_url': '${{ inputs.target_url }}',
              'dataset': '${{ inputs.dataset }}',
              'rate_type': '${{ inputs.rate_type }}',
              'rate': '${{ inputs.rate }}',
              'max_seconds': '${{ inputs.max_seconds }}',
              'data_column_mapper': '${{ env.DATA_COLUMN_MAPPER }}',
              'timestamp': '${TIMESTAMP}',
              'workflow_run_id': '${{ github.run_id }}',
              'workflow_run_url': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          }
          with open('${RESULT_DIR}/run_metadata.json', 'w') as f:
              json.dump(metadata, f, indent=2)
          PYEOF

          git add "${RESULT_DIR}"
          git commit -m "benchmark: add results for ${TIMESTAMP} on ${{ inputs.runner }}" || echo "Nothing to commit"

          # Generate/update REPORT.md from all results on this branch
          python3 - <<'PYEOF'
import json
from pathlib import Path
from collections import defaultdict

DATASET_INFO = {
    "InstructCoder": {
        "label": "InstructCoder — Coding Tasks",
        "description": "InstructCoder is the first dataset designed to adapt LLMs for general code editing.",
    },
    "NuminaMath-1.5": {
        "label": "NuminaMath-1.5 — 數學問題 (Short input, Long output)",
        "description": "This dataset serves as an internal validation set during the AIMO progress prize competition. 數學問題的 Dataset，短輸入、長輸出。",
    },
    "ShareGPT": {
        "label": "ShareGPT_Vicuna_unfiltered — 一般對話",
        "description": "一群 User 實際的對話紀錄 (ShareGPT_Vicuna_unfiltered).",
    },
    "cnn_dailymail": {
        "label": "CNN / DailyMail — Summarization (Long input, Short output)",
        "description": "The CNN / DailyMail Dataset contains 300k+ English news articles written by journalists at CNN and the Daily Mail. Summary 類型的 Dataset，長輸入、短輸出。",
    },
}

def get_mean(metric):
    if not metric:
        return None
    return metric.get("successful", metric).get("mean")

by_dataset = defaultdict(list)
for bench_file in sorted(Path("results").glob("*/*/benchmarks.json")):
    dataset = bench_file.parts[1]
    with open(bench_file) as f:
        data = json.load(f)
    for b in data["benchmarks"]:
        m = b["metrics"]
        entry = {
            "prompt_tokens": get_mean(m.get("prompt_token_count")),
            "output_tokens": get_mean(m.get("output_token_count")),
            "ttft_ms": get_mean(m.get("time_to_first_token_ms")),
            "output_tps": get_mean(m.get("output_tokens_per_second")),
            "active_users": get_mean(m.get("request_concurrency")),
        }
        if entry["ttft_ms"] is not None:
            by_dataset[dataset].append(entry)

lines = ["# Benchmark Report\n"]
for dataset in sorted(by_dataset):
    info = DATASET_INFO.get(dataset, {"label": dataset, "description": ""})
    runs = by_dataset[dataset]

    def avg(key):
        vals = [r[key] for r in runs if r.get(key) is not None]
        return sum(vals) / len(vals) if vals else None

    prompt  = avg("prompt_tokens")
    output  = avg("output_tokens")
    ttft    = avg("ttft_ms")
    tps     = avg("output_tps")
    users   = avg("active_users")

    lines.append(f"## On {info['label']}")
    lines.append(f"{info['description']}\n")
    lines.append(
        f"平均輸入 {prompt:.0f} tokens，輸出 {output:.0f} tokens｜"
        f"到第一個字花了 {ttft:.0f}ms｜"
        f"每秒 {tps:.0f} tokens｜"
        f"服務 {users:.1f} 個活躍用戶\n"
    )

with open("REPORT.md", "w") as f:
    f.write("\n".join(lines) + "\n")
print("REPORT.md updated")
PYEOF

          git add REPORT.md
          git commit -m "docs: update REPORT.md" || echo "Nothing to commit"
          git push origin benchmark-results
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
