name: Benchmark Golden Dataset

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to execute the workflow (e.g., ubuntu-latest, self-hosted, gpu-runner)'
        required: true
        type: string
        default: 'spark-1697'
      target_url:
        description: 'Target URL for the API endpoint (e.g., http://localhost:8000)'
        required: true
        type: string
        default: 'http://localhost:8000'
      dataset:
        description: 'Dataset name (e.g., vdaita/edit_5k_char)'
        required: true
        type: choice
        options:
          - vdaita/edit_5k_char
          - abisee/cnn_dailymail
          - AI-MO/NuminaMath-1.5
          - likaixin/InstructCoder
          - dataset/ShareGPT.json
        default: 'vdaita/edit_5k_char'
      rate_type:
        description: 'Rate type (e.g., concurrent, constant)'
        required: true
        type: string
        default: 'concurrent'
      rate:
        description: 'Request rate'
        required: true
        type: string
        default: '10'
      max_seconds:
        description: 'Maximum duration of the benchmark in seconds'
        required: true
        type: string
        default: '60'
      output_path:
        description: 'Output directory path'
        required: false
        type: string
        default: 'output'

jobs:
  benchmark:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect machine info
        run: |
          mkdir -p ${{ inputs.output_path }}
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          # CPU info
          CPU_MODEL=$(lscpu | grep 'Model name' | head -1 | sed 's/Model name:\s*//')
          CPU_SOCKETS=$(lscpu | grep '^Socket(s):' | head -1 | awk '{print $2}')
          CPU_CORES_PER_SOCKET=$(lscpu | grep '^Core(s) per socket:' | head -1 | awk '{print $4}')
          CPU_THREADS_PER_CORE=$(lscpu | grep '^Thread(s) per core:' | head -1 | awk '{print $4}')
          CPU_TOTAL_CORES=$((CPU_SOCKETS * CPU_CORES_PER_SOCKET))
          CPU_TOTAL_THREADS=$((CPU_TOTAL_CORES * CPU_THREADS_PER_CORE))
          CPU_ARCH=$(lscpu | grep '^Architecture:' | awk '{print $2}')
          MEM_TOTAL=$(free -b | awk '/^Mem:/{print $2}')
          MEM_AVAIL=$(free -b | awk '/^Mem:/{print $7}')

          # GPU info
          GPU_JSON="[]"
          if command -v nvidia-smi &> /dev/null; then
            GPU_JSON=$(nvidia-smi --query-gpu=index,name,driver_version,memory.total,compute_cap,uuid \
              --format=csv,noheader,nounits | python3 -c "
          import sys, json
          rows = []
          for line in sys.stdin:
              parts = [p.strip() for p in line.split(',')]
              if len(parts) >= 6:
                  def safe_int(v):
                      try: return int(v)
                      except: return None
                  rows.append({
                      'index': safe_int(parts[0]),
                      'name': parts[1],
                      'driver_version': parts[2],
                      'memory_total_mib': safe_int(parts[3]),
                      'compute_capability': parts[4],
                      'uuid': parts[5]
                  })
          print(json.dumps(rows))
          ")
          fi

          python3 - <<PYEOF
          import json, os
          data = {
              'timestamp': '${TIMESTAMP}',
              'os': '$(uname -s)',
              'kernel': '$(uname -r)',
              'hostname': '$(hostname)',
              'cpu': {
                  'model': '${CPU_MODEL}',
                  'architecture': '${CPU_ARCH}',
                  'sockets': int('${CPU_SOCKETS}' or 0),
                  'cores_per_socket': int('${CPU_CORES_PER_SOCKET}' or 0),
                  'threads_per_core': int('${CPU_THREADS_PER_CORE}' or 0),
                  'total_cores': int('${CPU_TOTAL_CORES}' or 0),
                  'total_threads': int('${CPU_TOTAL_THREADS}' or 0),
              },
              'memory': {
                  'total_bytes': int('${MEM_TOTAL}' or 0),
                  'available_bytes': int('${MEM_AVAIL}' or 0),
              },
              'gpus': json.loads('${GPU_JSON}'),
          }
          with open('${{ inputs.output_path }}/machine_info.json', 'w') as f:
              json.dump(data, f, indent=2)
          PYEOF

      - name: Run Benchmark
        run: |
          ~/.local/bin/uv venv
          source .venv/bin/activate
          ~/.local/bin/uv pip install guidellm

          # Determine data column and extra args based on dataset
          case "${{ inputs.dataset }}" in
            "AI-MO/NuminaMath-1.5")
              DATA_COLUMN_MAPPER='{"text_column":"problem"}'
              ;;
            "dataset/ShareGPT.json")
              DATA_COLUMN_MAPPER='{"text_column":"text"}'
              ;;
            "abisee/cnn_dailymail")
              DATA_COLUMN_MAPPER='{"text_column":"article"}'
              DATA_ARGS='{"name": "3.0.0"}'
              ;;
            "likaixin/InstructCoder")
              DATA_COLUMN_MAPPER='{"text_column":"input","prefix_column":"instruction"}'
              ;;
            *)
              DATA_COLUMN_MAPPER='{"text_column":"code"}'
              ;;
          esac

          echo "DATA_COLUMN_MAPPER=${DATA_COLUMN_MAPPER}" >> $GITHUB_ENV

          CMD=(guidellm benchmark
            --target "${{ inputs.target_url }}"
            --data "${{ inputs.dataset }}"
            --rate-type "${{ inputs.rate_type }}"
            --rate "${{ inputs.rate }}"
            --max-seconds "${{ inputs.max_seconds }}"
            --data-column-mapper "${DATA_COLUMN_MAPPER}"
            --output-dir "${{ inputs.output_path }}"
          )
          if [ -n "${DATA_ARGS:-}" ]; then
            CMD+=(--data-args "${DATA_ARGS}")
          fi
          "${CMD[@]}"

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: ${{ inputs.output_path }}
          retention-days: 30

      - name: Push results to benchmark-results branch
        if: always()
        run: |
          TIMESTAMP=$(date -u '+%Y%m%dT%H%M%SZ')
          DATASET_NAME=$(echo "${{ inputs.dataset }}" | sed 's|.*/||; s|\.json$||')
          RESULT_DIR="results/${DATASET_NAME}/${TIMESTAMP}_${{ inputs.runner }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          # Fetch and switch to benchmark-results branch (create orphan if not exists)
          if git fetch origin benchmark-results:benchmark-results 2>/dev/null; then
            git checkout benchmark-results
          else
            git checkout --orphan benchmark-results
            git rm -rf . --quiet 2>/dev/null || true
          fi

          # Copy results into timestamped directory
          mkdir -p "${RESULT_DIR}"
          cp -r ${{ inputs.output_path }}/. "${RESULT_DIR}/"

          # Write run metadata as JSON
          python3 - <<PYEOF
          import json
          metadata = {
              'runner': '${{ inputs.runner }}',
              'target_url': '${{ inputs.target_url }}',
              'dataset': '${{ inputs.dataset }}',
              'rate_type': '${{ inputs.rate_type }}',
              'rate': '${{ inputs.rate }}',
              'max_seconds': '${{ inputs.max_seconds }}',
              'data_column_mapper': '${{ env.DATA_COLUMN_MAPPER }}',
              'timestamp': '${TIMESTAMP}',
              'workflow_run_id': '${{ github.run_id }}',
              'workflow_run_url': 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          }
          with open('${RESULT_DIR}/run_metadata.json', 'w') as f:
              json.dump(metadata, f, indent=2)
          PYEOF

          # Generate per-run report.md
          export RESULT_DIR DATASET_NAME
          export DATASET_FULL="${{ inputs.dataset }}"
          export MAX_SECONDS="${{ inputs.max_seconds }}"
          python3 - <<PYEOF
          import json, os
          from pathlib import Path
          DATASET_INFO = {
              "InstructCoder":  (
                  "InstructCoder — Coding 任務",
                  "InstructCoder 是第一個專為 LLM 設計的程式碼編輯 dataset，涵蓋各種程式修改與生成任務。"
              ),
              "NuminaMath-1.5": (
                  "NuminaMath-1.5 — 數學推理任務",
                  "AIMO 競賽的內部驗證集，包含高難度數學題。特性：短輸入、長輸出（模型需進行多步推導）。"
              ),
              "ShareGPT": (
                  "ShareGPT — 一般對話",
                  "真實使用者與 AI 的對話紀錄（ShareGPT_Vicuna_unfiltered），涵蓋各種日常問答與指令場景。"
              ),
              "cnn_dailymail": (
                  "CNN / DailyMail — 新聞摘要",
                  "CNN 與 Daily Mail 共 30 萬篇新聞文章的摘要任務。特性：長輸入、短輸出（Summarization）。"
              ),
          }
          def sv(metric, field="mean"):
              if not metric: return None
              r = metric.get("successful", metric)
              if field == "pct":
                  return r.get("percentiles", {})
              return r.get(field)
          def fmt(v, decimals=1, fallback="N/A"):
              return ("%.{}f".format(decimals) % v) if v is not None else fallback
          def delta_row(name, cur, prv, unit="", lower_better=True):
              if cur is None or prv is None: return None
              d = cur - prv
              pct = d / prv * 100 if prv else 0
              icon = ("v" if (d < 0) == lower_better else "^") if abs(pct) > 0.5 else "-"
              return "| %s | %s%s | %s%s | %s %+.1f%% |" % (name, fmt(cur,2), unit, fmt(prv,2), unit, icon, pct)

          result_dir   = os.environ["RESULT_DIR"]
          dataset_name = os.environ["DATASET_NAME"]
          dataset_full = os.environ["DATASET_FULL"]
          max_sec      = os.environ.get("MAX_SECONDS", "?")
          bench_file   = Path(result_dir) / "benchmarks.json"
          if not bench_file.exists():
              print("No benchmarks.json, skipping report"); exit(0)
          with open(bench_file) as f:
              data = json.load(f)
          label, desc = DATASET_INFO.get(dataset_name, (dataset_full, ""))

          # Find previous run for comparison
          prev_m = None
          prev_name = None
          dataset_dir = Path("results") / dataset_name
          runs = sorted(dataset_dir.iterdir()) if dataset_dir.exists() else []
          if len(runs) >= 2:
              prev_file = runs[-2] / "benchmarks.json"
              if prev_file.exists():
                  with open(prev_file) as f2:
                      pd = json.load(f2)
                  if pd.get("benchmarks"):
                      prev_m = pd["benchmarks"][0]["metrics"]
                      prev_name = runs[-2].name

          lines = []
          lines.append("# Benchmark 報告 — " + label + "\n")
          lines.append("> " + desc + "\n")

          for b in data["benchmarks"]:
              m    = b["metrics"]
              conc = b["config"]["strategy"].get("worker_count") or b["config"]["strategy"].get("streams")
              dur  = b.get("duration", max_sec)

              prompt = sv(m.get("prompt_token_count"))
              output = sv(m.get("output_token_count"))
              ttft   = sv(m.get("time_to_first_token_ms"))
              tpot   = sv(m.get("time_per_output_token_ms"))
              itl    = sv(m.get("inter_token_latency_ms"))
              e2e    = sv(m.get("request_latency"))
              otps   = sv(m.get("output_tokens_per_second"))
              ttps   = sv(m.get("tokens_per_second"))
              rps    = sv(m.get("requests_per_second"))
              users  = sv(m.get("request_concurrency"))
              if ttft is None: continue

              ttft_p = sv(m.get("time_to_first_token_ms"), "pct")
              tpot_p = sv(m.get("time_per_output_token_ms"), "pct")
              itl_p  = sv(m.get("inter_token_latency_ms"), "pct")
              e2e_p  = sv(m.get("request_latency"), "pct")

              lines.append("## 執行配置：%d 個並發用戶，共執行 %s 秒\n" % (conc, fmt(dur, 0)))
              lines.append("### 摘要\n")
              lines.append(
                  "本次 benchmark 以 **%d 個並發用戶**持續執行 **%s 秒**。" % (conc, fmt(dur, 0))
              )
              lines.append(
                  "Dataset 中平均每個 prompt 含 **%s 個 input token**，模型回覆平均 **%s 個 output token**。\n"
                  % (fmt(prompt, 0), fmt(output, 0))
              )
              lines.append(
                  "- **TTFT（到第一個字的等待時間）**：平均 **%sms**（P95: %sms）"
                  " — 用戶送出 prompt 後等多久才開始看到回覆"
                  % (fmt(ttft, 1), fmt(ttft_p.get("p95") if ttft_p else None, 1))
              )
              tpot_hz = (1000 / tpot) if tpot else None
              lines.append(
                  "- **TPOT（每個 output token 的生成時間）**：平均 **%sms**（P95: %sms）"
                  " — 體感約 %s tok/s 的生成速度"
                  % (fmt(tpot, 1), fmt(tpot_p.get("p95") if tpot_p else None, 1), fmt(tpot_hz, 0))
              )
              lines.append(
                  "- **ITL（Token 間延遲）**：平均 **%sms**（P95: %sms）"
                  % (fmt(itl, 1), fmt(itl_p.get("p95") if itl_p else None, 1))
              )
              lines.append(
                  "- **E2E 延遲**：平均 **%ss**（P95: %ss）"
                  " — 從送出 prompt 到收到完整回覆的總時間"
                  % (fmt(e2e, 2), fmt(e2e_p.get("p95") if e2e_p else None, 2))
              )
              lines.append(
                  "- **Token Throughput**：output **%s tok/s**，total **%s tok/s**"
                  % (fmt(otps, 1), fmt(ttps, 1))
              )
              lines.append(
                  "- **Request Throughput**：**%s req/s**" % fmt(rps, 3)
              )
              lines.append(
                  "- **平均活躍用戶數**：**%s** / %d\n" % (fmt(users, 1), conc)
              )

              lines.append("### 詳細指標\n")
              lines.append("| 指標 | 平均 | P50 | P95 | P99 |")
              lines.append("|:-----|-----:|----:|----:|----:|")

              def trow(name, key, decimals=1):
                  raw = m.get(key)
                  if not raw: return None
                  r = raw.get("successful", raw)
                  pct = r.get("percentiles", {})
                  return "| %s | %s | %s | %s | %s |" % (
                      name,
                      fmt(r.get("mean"),       decimals),
                      fmt(pct.get("p50"),      decimals),
                      fmt(pct.get("p95"),      decimals),
                      fmt(pct.get("p99"),      decimals),
                  )

              for r in filter(None, [
                  trow("TTFT (ms)",               "time_to_first_token_ms"),
                  trow("TPOT (ms)",               "time_per_output_token_ms"),
                  trow("ITL (ms)",                "inter_token_latency_ms"),
                  trow("E2E Latency (s)",          "request_latency", 3),
                  trow("Output Throughput (tok/s)","output_tokens_per_second"),
                  trow("Total Throughput (tok/s)", "tokens_per_second"),
                  trow("RPS (req/s)",              "requests_per_second", 3),
                  trow("Active Users",             "request_concurrency"),
                  trow("Avg Input Tokens",         "prompt_token_count"),
                  trow("Avg Output Tokens",        "output_token_count"),
              ]):
                  lines.append(r)
              lines.append("")

              if prev_m:
                  lines.append("### 與前次執行比較（%s）\n" % prev_name)
                  lines.append("> v = 改善（數值下降），^ = 退步（數值上升），- = 持平")
                  lines.append("")
                  lines.append("| 指標 | 本次 | 前次 | 變化 |")
                  lines.append("|:-----|-----:|-----:|:-----|")
                  for r in filter(None, [
                      delta_row("TTFT (ms)",               sv(m.get("time_to_first_token_ms")),    sv(prev_m.get("time_to_first_token_ms")),    "ms", True),
                      delta_row("TPOT (ms)",               sv(m.get("time_per_output_token_ms")),  sv(prev_m.get("time_per_output_token_ms")),  "ms", True),
                      delta_row("ITL (ms)",                sv(m.get("inter_token_latency_ms")),    sv(prev_m.get("inter_token_latency_ms")),    "ms", True),
                      delta_row("E2E Latency (s)",         sv(m.get("request_latency")),           sv(prev_m.get("request_latency")),            "s",  True),
                      delta_row("Output Throughput (t/s)", sv(m.get("output_tokens_per_second")),  sv(prev_m.get("output_tokens_per_second")),  "",   False),
                      delta_row("RPS (req/s)",             sv(m.get("requests_per_second")),       sv(prev_m.get("requests_per_second")),       "",   False),
                  ]):
                      lines.append(r)
                  lines.append("")

          with open(Path(result_dir) / "report.md", "w") as f:
              f.write("\n".join(lines) + "\n")
          print("report.md written")
          PYEOF

          git add "${RESULT_DIR}"
          git commit -m "benchmark: add results for ${TIMESTAMP} on ${{ inputs.runner }}" || echo "Nothing to commit"
          git push origin benchmark-results
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
