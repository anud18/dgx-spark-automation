name: vscode-tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: spark-1697

    steps:
      - name: Download VS Code CLI
        run: |
          curl -L https://aka.ms/vscode-server-linux-x64 -o vscode_cli.tar.gz
          tar -xzf vscode_cli.tar.gz
          mv code vscode
          chmod +x vscode

      - name: Login with GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./vscode tunnel user login --provider github 

      - name: Start tunnel
        run: |
          ./vscode tunnel \
            --accept-server-license-terms \
            --name my-work-server

