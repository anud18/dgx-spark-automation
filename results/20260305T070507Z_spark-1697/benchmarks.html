e/58.0.3029.110 Safari/537.3', }  # Run the spider using CrawlerProcess process = scrapy.crawler.CrawlerProcess(settings) process.crawl(MySpider) process.start() ```  ---  ### \ud83d\udd0d Key Points:  1. **Scrapy automatically injects settings into the spider** via `self.settings`, so you can access them like:    ```python    self.settings.get('USER_AGENT')    ```    This is the **recommended and standard way**.  2. **You don\u2019t need to manually set `USER_AGENT` in the spider** \u2014 just pass it in `settings` to `CrawlerProcess`.  3. **The `settings` dictionary is passed to `CrawlerProcess`**, and it's automatically applied to all spiders.  4. You can **use `self.settings.get('key', default)`** to safely access settings.  ---  ### \u2705 Optional: Set User Agent in Spider (Alternative)  If you want to override the user agent directly in the spider (e.g., for debugging), you can do:  ```python class MySpider(scrapy.Spider):     name = 'myspider'      custom_settings = {         'USER_AGENT': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/58.0.3029.110 Safari/537.3',     }      def start_requests(self):         urls = [             'http://quotes.toscrape.com/page/1/',             'http://quotes.toscrape.com/page/2/',         ]         for url in urls:             yield scrapy.Request(url=url, callback=self.parse)      def parse(self, response):         quotes = response.css('div.quote')         for quote in quotes:             yield {                 'text': quote.css('span.text::text').get(),                 'author': quote.css('span small::text').get(),                 'tags': quote.css('div.tags a.tag::text').getall(),             }      def get_user_agent(self):         return self.settings.get('USER_AGENT') ```  > \u26a0\ufe0f Note: The `custom_settings` attribute is **not** used unless you define it in the spider class \u2014 and it's better to keep settings in the `CrawlerProcess` settings dictionary.  ---  ###
